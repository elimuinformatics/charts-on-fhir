<div class="legend">
  @for (layer of layerManager.enabledLayers$ | async; track layer.id) {
    @for (dataset of layer.datasets | sortDatasets; track dataset.label) {
      @if (!dataset.hidden) {
        <fhir-chart-legend-item [icon]="dataset.pointStyle" [color]="colorService.getColor(dataset)" [label]="dataset.label"></fhir-chart-legend-item>
      }
    }
  }
</div>
