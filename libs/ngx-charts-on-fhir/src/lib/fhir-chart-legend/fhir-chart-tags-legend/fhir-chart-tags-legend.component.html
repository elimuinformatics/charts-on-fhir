@if (enabledTags$ | async; as enabledTags) {
  <div class="legend">
    @for (tagStyle of this.tagsService.tagStyles$ | async | keyvalue; track tagStyle) {
      @if (enabledTags.includes(tagStyle.key)) {
        <fhir-chart-legend-item [icon]="tagStyle.value.pointStyle" [label]="tagStyle.key"></fhir-chart-legend-item>
      }
    }
  </div>
}
