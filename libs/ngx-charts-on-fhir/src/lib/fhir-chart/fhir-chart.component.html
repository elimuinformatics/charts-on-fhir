<div class="chart-container" [style.width]="width" [style.height]="height">
  <div class="chart-container-resize-fix">
    @if (datasets && datasets.length > 0) {
      @if (layerManager.dataRetrievalError$ | async) {
        <div class="error-msg" data-testid="chart-error">There was a problem retrieving data. The timeline may be incomplete.</div>
      }
      <canvas width="100%" baseChart id="baseChart" data-testid="chart-canvas" [type]="type ?? defaultType" [datasets]="datasets" [options]="options ?? defaultOptions"></canvas>
      <div class="floating-content-container">
        @if (floatingContent) {
          <div class="floating-content mat-elevation-z2" cdkDrag cdkDragBoundary=".chart-container">
            <ng-container [ngTemplateOutlet]="floatingContent"></ng-container>
          </div>
        }
      </div>
    } @else {
      <div class="empty-message" data-testid="chart-empty">
        <div class="empty-message-content">
          @if (layerManager.loading$ | async) {
            <div data-testid="chart-loading">Loading data...</div>
            <mat-progress-bar mode="indeterminate"></mat-progress-bar>
          } @else {
            {{ emptyMessage }}
          }
        </div>
      </div>
    }
  </div>
</div>
