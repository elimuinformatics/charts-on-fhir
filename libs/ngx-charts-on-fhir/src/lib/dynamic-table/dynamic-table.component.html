<div class="grid-table" [style.gridTemplateColumns]="'repeat(' + columns.length + ', auto)'">
  <div class="grid-thead">
    @for (col of columns; track col) {
      <div class="grid-th">{{ col | titlecase }}</div>
    }
  </div>
  @for (row of _data; track $index) {
    <div class="grid-tbody">
      @for (col of columns; track col) {
        <div class="grid-td">{{ row[col] }}</div>
      }
    </div>
  }
</div>
