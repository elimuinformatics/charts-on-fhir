@if (scalePositions$ | async; as positions) {
  @if (layerManager.enabledLayers$ | async; as layers) {
    @if (layers.length > 0) {
      <div
        class="chart-summary"
        [style.paddingTop]="autoAlign ? positions[layers[0].scale.id].top + 'px' : '0'"
        [style.gridTemplateRows]="autoAlign ? (gridTemplateRows$ | async) : ''"
      >
        @for (layer of layers; track layer; let index = $index) {
          <fhir-chart-summary-card
            class="dataset-summary mat-elevation-z2"
            [style.gridRow]="index + 1"
            [layer]="layer"
            [expanded]="expandedCard === layer.id"
            (expand)="onCardExpand(layer.id)"
            (collapse)="onCardCollapse(layer.id)"
          >
          </fhir-chart-summary-card>
        }
        @if (expandedCard != null) {
          <button type="button" class="backdrop" aria-label="Close expanded summary card" (click)="expandedCard = null"></button>
        }
      </div>
    }
  }
}
