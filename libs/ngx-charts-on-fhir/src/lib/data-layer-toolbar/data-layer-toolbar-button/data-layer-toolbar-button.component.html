<div class="button-wrapper" [class.active]="active">
  <button
    mat-icon-button
    [matTooltip]="tooltip"
    matTooltipPosition="right"
    [matBadge]="badge"
    [matBadgeHidden]="!badge"
    matBadgeSize="medium"
    matBadgeOverlap="true"
  >
    <mat-icon>{{ icon }}</mat-icon>
  </button>
</div>
