# Copilot coding agent environment setup.
# Job name MUST be exactly "copilot-setup-steps".

name: "Copilot Setup Steps"
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/copilot-setup-steps.yml"]

jobs:
  copilot-setup-steps: # ⚠ MUST be this exact name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      # Install all dependencies (including dev dependencies for build tooling)
      # HUSKY=0 prevents husky from trying to install git hooks in the CI environment
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      # Build all Nx projects (Angular apps and libraries)
      # --all is deprecated in Nx 22; run-many targets all projects by default
      - name: Build
        run: npx nx run-many --target=build --parallel=3

      # Run unit tests across all projects
      - name: Test
        run: npx nx run-many --target=test --parallel=3 --passWithNoTests
