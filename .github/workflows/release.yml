name: Release

on:
  release:
    types: [published]

permissions:
  id-token: write # Required for OIDC
  contents: read

env:
  NODE_VERSION: 22.x

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          cache: npm

      # npm 11.5.1+ is required for trusted publishing (OIDC)
      - name: Update npm
        run: npm install -g npm@11.5.1 --ignore-scripts

      - name: Show npm version
        run: npm --version

      - run: npm ci --ignore-scripts && npm rebuild @parcel/watcher nice-napi nx esbuild @swc/core
      - run: npm run build ngx-charts-on-fhir
      - run: npm publish dist/libs/ngx-charts-on-fhir/ --access public

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci --ignore-scripts && npm rebuild @parcel/watcher nice-napi nx esbuild @swc/core
      - run: npm run build documentation -- --base-href=/charts-on-fhir/
      - run: cp dist/apps/documentation/browser/index.html dist/apps/documentation/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/apps/documentation/browser

  deploy-docs:
    name: Publish Documentation
    needs: build-docs
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
