name: Pull Request

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

env:
  NODE_VERSION: 20.x

jobs:
  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci --ignore-scripts && npm rebuild @parcel/watcher nice-napi nx esbuild @swc/core
      - run: node_modules/.bin/nx format:check

  build-affected:
    name: Production Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci --ignore-scripts && npm rebuild @parcel/watcher nice-napi nx esbuild @swc/core
      - run: node_modules/.bin/nx affected -t build --parallel=3

  test-affected:
    name: Test and Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read # allows SonarCloud to decorate PRs with analysis results
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci --ignore-scripts && npm rebuild @parcel/watcher nice-napi nx esbuild @swc/core
      - if: ${{ github.ref == 'refs/heads/main' }} # Run all tests when merging to main for accurate coverage in SonarCloud
        run: node_modules/.bin/nx run-many -t test --parallel=3 --no-watch --code-coverage
      - if: ${{ github.ref != 'refs/heads/main' }} # Only test affected projects in PRs
        run: node_modules/.bin/nx affected -t test --parallel=3 --no-watch --code-coverage
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Generate a token on Sonarcloud.io, add it to the secrets of this repo with the name SONAR_TOKEN (Settings > Secrets > Actions > add new repository secret)
        with:
          args:
            # Unique keys of your project and organization. You can find them in SonarCloud > Information (bottom-left menu)
            # mandatory
            -Dsonar.projectKey=elimuinformatics_charts-on-fhir
            -Dsonar.organization=elimuinformatics-1
            -Dsonar.javascript.lcov.reportPaths=coverage/**/lcov.info
            -Dsonar.coverage.exclusions=**/*.spec.ts,**/test.ts,**/main.ts,**/polyfills.ts,**/*.module.ts,**/environment*.ts,**/*.js,projects/synthea-utils/*,apps/documentation/**/*,apps/*/src/app/app.config.ts
            -Dsonar.test.inclusions=**/*.spec.ts,**/test.ts

  test-npm-package:
    name: Test NPM Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci --ignore-scripts && npm rebuild @parcel/watcher nice-napi nx esbuild @swc/core
      - run: node_modules/.bin/nx affected -t test-npm-package --parallel=3
